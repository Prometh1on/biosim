name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python 3.14)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # CI installs the fully pinned set; requirements.txt lists the direct
      # dependencies with minimum versions (see README, "Setup").
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      # Fail on the pytest-10 removal warnings so they cannot creep back in.
      - name: Run the test suite
        run: python -m pytest -q -W error::pytest.PytestRemovedIn10Warning

      # The README demo must run and must not modify or add any tracked file.
      - name: Run the demo
        run: python scripts/demo.py

      # Fails on modified OR new untracked files (outputs/ is gitignored).
      - name: Check the working tree is clean
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
